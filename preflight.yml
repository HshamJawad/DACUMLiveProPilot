name: Preflight

# Runs on every push and pull request. The two checks below guard the
# failure modes this project has actually hit — both of which produce no
# error in the browser and are therefore invisible in manual testing:
#
#   * a stylesheet claiming ownership of a component another sheet
#     already owns, which silently changes appearance depending on load
#     order (the oval buttons, the dead toolbar scroll, the two-row
#     rating scale)
#   * an asset missing from the service worker precache, which keeps
#     working online and breaks only when the network drops
#
# Neither can be caught by looking at the page in a browser with a good
# connection, which is why they need to be machine-checked.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: CSS ownership
        # --max 0 because the count reached zero in Phase 4. Anything
        # above zero means a component is being styled from two places
        # again, and the number only ever drifts upward if nothing is
        # watching. Raise this threshold only with a written reason.
        run: node tools/css-ownership-audit.mjs . --max 0

      - name: Service worker precache and version bump
        run: node tools/preflight.mjs .
